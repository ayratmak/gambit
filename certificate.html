<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, follow">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>Certificate · Gambit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/app.css?v=6">
<link rel="stylesheet" href="assets/certificate.css?v=1">
</head>
<body>
<main class="wrap" id="main"></main>
<script src="assets/core.js?v=10"></script>
<script src="assets/courses/foundations.js?v=5"></script>
<script src="assets/courses/strategy.js?v=5"></script>
<script src="assets/courses/negotiation.js?v=5"></script>
<script src="assets/courses/psychology.js?v=5"></script>
<script src="assets/courses/game-plan.js?v=5"></script>
<script src="assets/courses/procurement.js?v=5"></script>
<script src="assets/courses/true-price.js?v=5"></script>
<script src="assets/courses/auctions.js?v=5"></script>
<script src="assets/courses/advanced-auctions.js?v=5"></script>
<script src="assets/data.js?v=5"></script>
<script src="assets/worlds.js?v=2"></script>
<script>
(() => {
  const { Store, esc } = G;
  if (!G.requireUser()) return;
  G.header('certificates');
  const main = document.getElementById('main');
  const course = COURSES.find(c => c.id === G.qs('c'));
  const exam = course && Store.exam(course.id);
  if (!course || !exam || !exam.passed) {
    main.innerHTML = `<div class="empty"><span class="mono">Certificate</span><h1>Not earned yet.</h1>
      <p class="muted">Finish every lesson${course ? ' in ' + esc(course.title) : ''} and pass the final assessment to earn this certificate.</p>
      <div><a class="btn solid" href="${course ? 'course.html?c=' + course.id : 'app.html'}">Go to the course</a></div></div>`;
    return;
  }
  const d = new Date(exam.date);
  const date = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  const parts = course.title.split(' '), lastWord = parts.pop();
  const verifyUrl = exam.saved && exam.certId ? 'https://gambitschool.com/verify/' + exam.certId : '';
  const li = 'https://www.linkedin.com/profile/add?' + new URLSearchParams({
    startTask: 'CERTIFICATION_NAME', name: course.title, organizationName: 'Gambit',
    issueYear: d.getFullYear(), issueMonth: d.getMonth() + 1, certId: exam.certId || '', certUrl: verifyUrl
  });
  main.innerHTML = `
    <div class="bar-top">
      <a class="crumb" href="app.html#certificates">← My certificates</a>
      <div class="actions">
        ${verifyUrl ? `<button class="btn ghost small" id="copy">Copy verify link</button>
        <a class="btn ghost small" href="${li}" target="_blank" rel="noopener">Add to LinkedIn</a>` : ''}
        <button class="btn solid small" id="print">Download PDF</button>
      </div>
    </div>
    ${verifyUrl
      ? `<p class="muted" style="width:min(1000px,100%);font-size:14px">Verified and saved to your account. Anyone can check it at <a href="${verifyUrl}" style="text-decoration:underline;text-underline-offset:3px">${verifyUrl.replace('https://', '')}</a>.</p>`
      : `<div class="empty" style="width:min(1000px,100%)"><b>This certificate isn't verified yet.</b><p class="muted">You passed before Gambit started recording certificates, so it only exists on this device. Retake the final assessment (it takes about 10 minutes) and we'll issue a verified certificate with a public link you can share and add to LinkedIn.</p><div><a class="btn solid" href="lesson.html?c=${course.id}&exam=1">Retake to verify</a></div></div>`}
    <article class="cert" aria-label="Certificate of completion">
      <div class="frame">
        <div class="c-head">
          <span class="c-brand"><canvas class="piece-icon" data-piece="knight" aria-hidden="true"></canvas>Gambit</span>
          <span class="c-mono">Certificate of completion</span>
        </div>
        <div class="c-body">
          <span class="c-title">This certifies that</span>
          <span class="c-name">${esc(Store.user.name)}</span>
          <span class="c-line"></span>
          <span class="c-title">has completed</span>
          <span class="c-course">${esc(parts.join(' '))} <em>${esc(lastWord)}</em></span>
          <p class="c-desc">${esc(course.summary)}</p>
        </div>
        <div class="c-foot">
          <div><span class="c-mono">Awarded</span><b>${date}</b></div>
          <div><span class="c-mono">Assessment</span><b class="num">${exam.score} of ${exam.total}</b></div>
          <div><span class="c-mono">Certificate ID</span><b class="num">${esc(exam.certId || 'Not yet issued')}</b></div>
          <div class="seal"><canvas id="seal" aria-hidden="true"></canvas></div>
        </div>
      </div>
    </article>`;

  // The certificate keeps its paper colours in dark mode, so paint its icons directly
  const paint = (cv, fn) => { const px = Math.round(cv.clientWidth * 2) || 200; cv.width = cv.height = px; const c = cv.getContext('2d'); fn(c, px); };
  const logo = document.querySelector('.c-brand canvas');
  paint(logo, (c, px) => { c.scale(px / 100, px / 100); c.fillStyle = '#17150F'; G.drawPiece(c, 'knight'); });
  const seal = () => paint(document.getElementById('seal'), (c, px) => {
    const r = px / 2; c.translate(r, r);
    c.strokeStyle = '#2E5B45'; c.lineWidth = px * .012;
    c.beginPath(); c.arc(0, 0, r * .96, 0, Math.PI * 2); c.stroke();
    c.beginPath(); c.arc(0, 0, r * .74, 0, Math.PI * 2); c.stroke();
    c.fillStyle = '#2E5B45'; c.font = `500 ${px * .07}px "Geist Mono", monospace`; c.textAlign = 'center'; c.textBaseline = 'middle';
    const text = 'GAMBIT · GAME THEORY · VERIFIED · ', n = text.length;
    for (let k = 0; k < n; k++) { c.save(); c.rotate((k / n) * Math.PI * 2); c.fillText(text[k], 0, -r * .85); c.restore(); }
    c.save(); c.translate(-r * .38, -r * .42); c.scale(r * .0076, r * .0076); G.drawPiece(c, 'king'); c.restore();
  });
  seal();
  document.fonts && document.fonts.ready.then(seal);

  document.getElementById('print').addEventListener('click', () => window.print());
  const copy = document.getElementById('copy');
  copy && copy.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(verifyUrl); G.toast('Verify link copied'); }
    catch { G.toast('Copy the address bar to share'); }
  });
})();
</script>
</body>
</html>
