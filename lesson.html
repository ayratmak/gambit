<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, follow">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>Lesson · Gambit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/app.css?v=6">
<style>
  body { display: grid; grid-template-rows: auto 1fr auto; min-height: 100vh; }
  .ltop { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
  .ltop-in { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 16px; align-items: center; height: 64px; }
  .x { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line-strong); display: grid; place-items: center; color: var(--muted); }
  .x:hover { color: var(--ink); background: var(--surface); }
  .segs { display: flex; gap: 4px; }
  .segs i { flex: 1; height: 5px; border-radius: 5px; background: var(--line); transition: background .4s; }
  .segs i.on { background: var(--accent); }
  .segs i.cur { background: var(--ink); }

  .stage { width: min(760px, 100%); margin-inline: auto; padding: clamp(28px, 5vw, 56px) var(--gutter) 40px; }
  .step { display: grid; gap: 22px; animation: rise .45s cubic-bezier(.2, .8, .2, 1); }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  .step h2 { font-size: clamp(32px, 4.4vw, 46px); line-height: 1.04; letter-spacing: -.025em; }
  .step .body { display: grid; gap: 16px; }
  .step .body p { font: 350 clamp(18px, 2vw, 21px)/1.5 var(--font-display); }
  .step .body b { font-weight: 550; }
  .prompt { font-size: 16px; color: var(--muted); max-width: 60ch; }
  .q { font: 400 clamp(22px, 2.6vw, 28px)/1.25 var(--font-display); letter-spacing: -.01em; }

  .opts { display: grid; gap: 10px; }
  .opt {
    text-align: left; padding: 16px 18px; border-radius: 10px; border: 1.5px solid var(--line-strong); background: var(--surface);
    cursor: pointer; font-size: 16px; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; align-items: start;
    transition: border-color .2s, background .2s, transform .15s;
  }
  .opt:hover:not(:disabled) { border-color: var(--ink); }
  .opt:active:not(:disabled) { transform: scale(.995); }
  .opt .k { width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--line-strong); display: grid; place-items: center; font: 500 11px var(--font-mono); color: var(--muted); }
  .opt.sel { border-color: var(--ink); background: var(--raised); }
  .opt.good { border-color: var(--accent); background: var(--accent-soft); }
  .opt.good .k { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .opt.bad { border-color: var(--bad); background: var(--bad-soft); }
  .opt.bad .k { background: var(--bad); border-color: var(--bad); color: var(--bg); }
  .opt:disabled { cursor: default; }

  .sort { display: grid; gap: 10px; }
  .sitem { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 10px; border: 1.5px solid var(--line-strong); background: var(--surface); }
  .sitem .why { grid-column: 1 / -1; font-size: 14px; color: var(--muted); }
  .sitem.good { border-color: var(--accent); }
  .sitem.bad { border-color: var(--bad); }
  .sbtns { display: flex; gap: 6px; }
  .sbtns button { border: 1px solid var(--line-strong); background: var(--raised); border-radius: 999px; padding: 7px 12px; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .sbtns button:hover:not(:disabled) { border-color: var(--ink); }
  .sbtns button.pick { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .sbtns button.wrong { background: var(--bad); border-color: var(--bad); color: var(--bg); }

  .mx-wrap { overflow-x: auto; }
  .mx { border-collapse: separate; border-spacing: 6px; width: 100%; min-width: 320px; font-variant-numeric: tabular-nums; }
  .mx th { font: 500 11px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 4px 6px; text-align: left; }
  .mx td { position: relative; height: 84px; padding: 0; border-radius: 8px; }
  .mx td > button, .mx td > div {
    width: 100%; height: 100%; display: flex; align-items: flex-end; padding: 12px 14px; border-radius: 8px;
    border: 1.5px dashed var(--line-strong); background: transparent; text-align: left; transition: background .2s, border-color .2s;
  }
  .mx td > button { cursor: pointer; }
  .mx td > button:hover:not(:disabled) { border-style: solid; border-color: var(--ink); }
  .mx .pay { font: 400 28px var(--font-display); }
  .mx .pay i { font-style: normal; color: var(--muted); }
  .mx .on { border-style: solid; border-color: var(--ink); background: var(--raised); }
  .mx .hl { border-style: solid; border-color: var(--accent); background: var(--accent-soft); }
  .mx .ok { border-style: solid; border-color: var(--accent); background: var(--accent-soft); }
  .mx .no { border-style: solid; border-color: var(--bad); background: var(--bad-soft); }
  .mx .miss { border-style: dashed; border-color: var(--accent); border-width: 2px; }
  .mx .flag { position: absolute; top: 9px; right: 11px; font: 500 10px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .mx-note { font-size: 13px; color: var(--muted); }
  .explore-log { min-height: 3.2em; font: 350 19px/1.45 var(--font-display); }

  .game { border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface); padding: clamp(16px, 3vw, 26px); display: grid; gap: 20px; }
  .game-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .score { display: flex; gap: 24px; }
  .score div { display: grid; }
  .score b { font: 400 34px/1 var(--font-display); }
  .moves { display: flex; flex-wrap: wrap; gap: 10px; }
  .moves .btn { flex: 1 1 150px; }
  .track { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
  .sq { aspect-ratio: 1; border-radius: 4px; display: grid; place-items: center; font: 500 11px var(--font-mono); color: var(--muted); border: 1px solid var(--line); }
  .sq:nth-child(even) { background: var(--line); }
  .sq.done { color: var(--ink); }
  .sq.now { border-color: var(--accent); color: var(--accent); }
  .debrief { font: 350 18px/1.5 var(--font-display); min-height: 2.8em; }
  .debrief strong { font-weight: 550; }

  /* slider calculator */
  .calc { display: grid; gap: 18px; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface); padding: clamp(16px, 3vw, 24px); }
  .calc label { display: grid; gap: 8px; font-size: 15px; }
  .calc .lab { display: flex; justify-content: space-between; gap: 12px; }
  .calc .lab b { font: 500 15px var(--font-mono); }
  .calc input[type=range] { width: 100%; accent-color: var(--accent); }
  .outs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .out { border: 1px dashed var(--line-strong); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; }
  .out b { font: 400 28px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
  .out.goal-on { border-style: solid; border-color: var(--accent); background: var(--accent-soft); }
  .goal { font-size: 14px; color: var(--muted); }

  /* game tree */
  .tree { display: grid; gap: 10px; }
  .tnode { border-left: 2px solid var(--line-strong); padding-left: 14px; display: grid; gap: 8px; }
  .tnode > .who { font: 500 11px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .topt { display: grid; gap: 8px; }
  .topt > button { text-align: left; display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--line-strong); background: var(--surface); cursor: pointer; font-size: 15px; }
  .topt > button:hover:not(:disabled) { border-color: var(--ink); }
  .topt > button .lp { font: 400 20px var(--font-display); white-space: nowrap; }
  .topt > button .lp i { font-style: normal; color: var(--muted); }
  .topt > button.on { border-color: var(--ink); background: var(--raised); }
  .topt > button.ok { border-color: var(--accent); background: var(--accent-soft); }
  .topt > button.no { border-color: var(--bad); background: var(--bad-soft); }
  .topt > button.miss { border-style: dashed; border-color: var(--accent); }
  .topt > button:disabled { cursor: default; }
  .topt > .tnode { margin-left: 10px; }
  .topt.pruned > .tnode { opacity: .45; }

  /* dialogue */
  .chat { display: grid; gap: 12px; }
  .bub { max-width: 88%; padding: 12px 16px; border-radius: 14px; font: 350 18px/1.45 var(--font-display); }
  .bub.them { background: var(--surface); border: 1px solid var(--line-strong); justify-self: start; border-bottom-left-radius: 4px; }
  .bub.you { background: var(--ink); color: var(--bg); justify-self: end; border-bottom-right-radius: 4px; }
  .bub .nm { display: block; font: 500 10px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; opacity: .65; margin-bottom: 4px; }
  .coach { justify-self: end; max-width: 88%; font-size: 14px; color: var(--muted); }
  .coach b { color: var(--ink); font-weight: 500; }
  .result { border: 1px solid var(--line-strong); border-radius: 12px; padding: 16px 18px; display: grid; gap: 6px; font: 350 18px/1.45 var(--font-display); }
  .result.good { border-color: var(--accent); background: var(--accent-soft); }
  .result.bad { border-color: var(--bad); background: var(--bad-soft); }

  /* auction */
  .auc { display: grid; gap: 16px; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface); padding: clamp(16px, 3vw, 24px); }
  .auc .you-val { font: 400 clamp(26px, 3.4vw, 34px)/1.1 var(--font-display); }
  .bidrow { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .bidrow input { width: 140px; }
  .bids { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
  .bids div { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: 500 13px var(--font-mono); display: grid; gap: 2px; }
  .bids div span { font: 500 10px var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .bids div.me { border-color: var(--ink); }
  .bids div.win { border-color: var(--accent); background: var(--accent-soft); }
  .auc .out-line { font: 350 18px/1.45 var(--font-display); }

  .points { display: grid; gap: 12px; list-style: none; margin: 0; padding: 0; counter-reset: p; }
  .points li { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; padding: 18px; border: 1px dashed var(--line-strong); border-radius: 10px; font: 350 19px/1.4 var(--font-display); counter-increment: p; }
  .points li::before { content: counter(p); font: 400 26px/1 var(--font-display); color: var(--accent); }

  .done-card { text-align: left; display: grid; gap: 22px; }
  .done-card canvas { width: 96px; height: 96px; }
  .done-card h2 { font-size: clamp(40px, 6vw, 64px); }
  .done-card h2 em { color: var(--accent); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .tile { border: 1px solid var(--line); border-radius: 10px; padding: 16px; background: var(--surface); display: grid; gap: 4px; }
  .tile b { font: 400 30px/1 var(--font-display); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }

  .world-cta { display: grid; gap: 4px; padding: 16px 18px; margin-bottom: 26px; border-radius: 12px; border: 1.5px solid var(--accent); background: var(--accent-soft); grid-template-columns: minmax(0, 1fr) auto; }
  .world-cta > * { grid-column: 1; }
  .world-cta b { font: 400 22px var(--font-display); }
  .world-cta .go { grid-column: 2; grid-row: 1 / span 3; align-self: center; font-weight: 500; color: var(--accent); }
  .world-cta:hover { background: color-mix(in srgb, var(--accent) 18%, var(--bg)); }
  @media (max-width: 560px) { .world-cta { grid-template-columns: 1fr; } .world-cta .go { grid-column: 1; grid-row: auto; } }
  .lfoot { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); transition: background .3s; }
  .lfoot.good { background: color-mix(in srgb, var(--accent) 12%, var(--bg)); }
  .lfoot.bad { background: color-mix(in srgb, var(--bad) 10%, var(--bg)); }
  .lfoot-in { width: min(760px, 100%); margin-inline: auto; padding: 16px var(--gutter); display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .fb { font-size: 15px; min-width: 0; }
  .fb strong { display: block; font-size: 16px; }
  .lfoot.good .fb strong { color: var(--accent); }
  .lfoot.bad .fb strong { color: var(--bad); }
  .lfoot .btn { min-width: 150px; }
  @media (max-width: 560px) {
    .sitem { grid-template-columns: 1fr; }
    .lfoot-in { flex-direction: column; align-items: stretch; }
    .mx { min-width: 0; border-spacing: 4px; }
    .mx th { font-size: 9.5px; letter-spacing: .03em; padding: 2px; }
    .mx td { height: 64px; }
    .mx td > button, .mx td > div { padding: 8px 10px; }
    .mx .pay { font-size: 21px; }
    .sq { font-size: 8.5px; letter-spacing: -.02em; }
  }
</style>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
<header class="ltop"><div class="wrap ltop-in">
  <a class="x" id="close" href="app.html" aria-label="Leave lesson">✕</a>
  <div class="segs" id="segs" aria-hidden="true"></div>
  <span class="mono num" id="count"></span>
</div></header>
<main class="stage" id="stage" aria-live="polite"></main>
<footer class="lfoot" id="foot"><div class="lfoot-in">
  <div class="fb" id="fb"></div>
  <button class="btn solid" id="next" disabled>Continue</button>
</div></footer>

<script src="assets/core.js?v=10"></script>
<script src="assets/courses/foundations.js?v=5"></script>
<script src="assets/courses/strategy.js?v=5"></script>
<script src="assets/courses/negotiation.js?v=5"></script>
<script src="assets/courses/psychology.js?v=5"></script>
<script src="assets/courses/game-plan.js?v=5"></script>
<script src="assets/courses/procurement.js?v=5"></script>
<script src="assets/courses/true-price.js?v=5"></script>
<script src="assets/courses/auctions.js?v=5"></script>
<script src="assets/courses/advanced-auctions.js?v=5"></script>
<script src="assets/data.js?v=5"></script>
<script src="assets/worlds.js?v=1"></script>
<script>
(() => {
  const { Store, esc, lessonsOf, playable, canOpen } = G;
  const course = COURSES.find(c => c.id === G.qs('c'));
  const examMode = G.qs('exam') === '1';
  const lesson = course && lessonsOf(course).find(l => l.id === G.qs('l'));
  // The preview lesson of every course is playable without an account; everything else needs sign-in.
  const anon = !Store.user;
  if (anon && (examMode || !lesson || !lesson.preview)) { G.requireUser(); return; }
  const stage = document.getElementById('stage'), foot = document.getElementById('foot'), fb = document.getElementById('fb'), nextBtn = document.getElementById('next');
  const back = course ? 'course.html?c=' + course.id : 'app.html';
  document.getElementById('close').href = back;

  // Access rules
  if (!course || (!examMode && (!lesson || !playable(lesson)))) { stage.innerHTML = `<h2>We couldn't find that lesson.</h2><p><a class="btn ghost" href="${back}">Back</a></p>`; foot.hidden = true; return; }
  if (examMode && (!Store.owns(course.id) || !course.exam)) { location.replace(back); return; }
  if (!examMode && !canOpen(course, lesson)) { location.replace(back + '&buy=1'); return; }

  const steps = examMode ? course.exam.questions.map(q => ({ t: 'exam', ...q })) : lesson.steps;
  document.title = (examMode ? 'Final assessment' : lesson.title) + ' · Gambit';
  let i = examMode ? 0 : Math.max(0, Math.min(steps.length - 1, (+G.qs("step") || 1) - 1)), firstTry = 0, graded = 0, examScore = 0, examPicks = [];
  const segs = document.getElementById('segs');
  segs.innerHTML = steps.map(() => '<i></i>').join('');

  function setFoot(state, title, text, label) {
    foot.className = 'lfoot' + (state ? ' ' + state : '');
    fb.innerHTML = title ? `<strong>${esc(title)}</strong>${text ? `<span>${text}</span>` : ''}` : (text || '');
    nextBtn.textContent = label || 'Continue';
  }
  const ready = (on = true) => { nextBtn.disabled = !on; };

  /* ---------- Shared payoff matrix ---------- */
  function matrix(m, { clickable = false, highlightCol = null } = {}) {
    const wrap = document.createElement('div'); wrap.className = 'mx-wrap';
    const tag = clickable ? 'button' : 'div';
    wrap.innerHTML = `<table class="mx"><thead><tr><th></th>${m.cols.map(c => `<th scope="col">${esc(c)}</th>`).join('')}</tr></thead><tbody>
      ${m.rows.map((r, ri) => `<tr><th scope="row">${esc(r)}</th>${m.cols.map((c, ci) => `<td><${tag} data-r="${ri}" data-c="${ci}" class="${highlightCol === ci ? 'hl' : ''}" ${clickable ? `aria-label="${esc(r)}, ${esc(c)}"` : ''}><span class="pay">${m.pay[ri][ci][0]}<i>, ${m.pay[ri][ci][1]}</i></span></${tag}></td>`).join('')}</tr>`).join('')}
      </tbody></table>${m.unit ? `<p class="mx-note">Your payoff first, theirs second · ${esc(m.unit)}</p>` : ''}`;
    return wrap;
  }
  const nash = m => {
    const out = [];
    m.pay.forEach((row, r) => row.forEach((cell, c) => {
      const bestRow = m.pay.every(rr => rr[c][0] <= cell[0]);
      const bestCol = row.every(cc => cc[1] <= cell[1]);
      if (bestRow && bestCol) out.push(r + '-' + c);
    }));
    return out;
  };

  /* ---------- Step renderers ---------- */
  const R = {};
  const BOTS = { tft: ['tit-for-tat', 'co-operate first, then copy your previous move.'], grim: ['grim trigger', 'co-operate until you defect once, then defect for ever.'], always: ['a never-co-operate rule', 'it defects every round.'] };
  R.read = (s, el) => {
    el.innerHTML = `<h2>${esc(s.title)}</h2><div class="body">${s.body.map(p => `<p>${p}</p>`).join('')}</div>`;
    if (s.figure) el.appendChild(matrix(s.figure));
    setFoot('', '', ''); ready();
  };
  R.summary = (s, el) => {
    el.innerHTML = `<span class="mono">Key ideas</span><h2>What to remember</h2><ol class="points">${s.points.map(p => `<li>${esc(p)}</li>`).join('')}</ol>`;
    setFoot('', '', ''); ready();
  };
  R.choice = (s, el) => {
    el.innerHTML = `${s.title ? `<span class="mono">${esc(s.title)}</span>` : ''}<p class="q">${esc(s.q)}</p>`;
    if (s.figure) el.appendChild(matrix(s.figure, { highlightCol: s.highlightCol ?? null }));
    const box = document.createElement('div'); box.className = 'opts';
    box.innerHTML = s.options.map((o, k) => `<button class="opt" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${esc(o.text)}</span></button>`).join('');
    el.appendChild(box);
    let tries = 0;
    box.addEventListener('click', e => {
      const b = e.target.closest('.opt'); if (!b || b.disabled) return;
      const o = s.options[+b.dataset.k]; tries++;
      if (o.ok) {
        b.classList.add('good'); box.querySelectorAll('.opt').forEach(x => x.disabled = true);
        if (tries === 1) firstTry++;
        graded++;
        setFoot('good', tries === 1 ? 'Correct' : 'Got there', esc(o.why)); ready();
      } else {
        b.classList.add('bad'); b.disabled = true;
        setFoot('bad', 'Not quite', esc(o.why) + ' Try another answer.'); ready(false);
      }
    });
    setFoot('', '', 'Pick an answer.'); ready(false);
  };
  R.sort = (s, el) => {
    el.innerHTML = `<span class="mono">${esc(s.title)}</span><p class="q">${esc(s.prompt)}</p>`;
    const box = document.createElement('div'); box.className = 'sort';
    let solved = 0, misses = 0;
    s.items.forEach((it, k) => {
      const row = document.createElement('div'); row.className = 'sitem';
      row.innerHTML = `<span>${esc(it.text)}</span><span class="sbtns">${s.buckets.map((b, bi) => `<button data-b="${bi}">${esc(b)}</button>`).join('')}</span><span class="why" hidden></span>`;
      row.querySelector('.sbtns').addEventListener('click', e => {
        const btn = e.target.closest('button'); if (!btn || btn.disabled) return;
        const why = row.querySelector('.why');
        if (+btn.dataset.b === it.bucket) {
          btn.classList.add('pick'); row.classList.remove('bad'); row.classList.add('good');
          row.querySelectorAll('button').forEach(x => x.disabled = true);
          why.hidden = false; why.textContent = it.why; solved++;
          if (solved === s.items.length) {
            graded++; if (!misses) firstTry++;
            setFoot('good', misses ? 'All sorted' : 'All correct first time', ''); ready();
          }
        } else {
          misses++; btn.classList.add('wrong'); btn.disabled = true; row.classList.add('bad');
          why.hidden = false; why.textContent = 'Not quite. ' + it.why;
        }
      });
      box.appendChild(row);
    });
    el.appendChild(box);
    setFoot('', '', `Sort all ${s.items.length} to continue.`); ready(false);
  };
  R.matrix = (s, el) => {
    el.innerHTML = `<span class="mono">${esc(s.title)}</span><p class="q">${esc(s.prompt)}</p>`;

  R.auction = (s, el) => {
    el.innerHTML = `<span class="mono">${esc(s.title)}</span><p class="q">${esc(s.prompt)}</p>`;
    const box = document.createElement('div'); box.className = 'auc'; el.appendChild(box);
    const buy = s.side === 'buy', N = s.rivals + 1, u = s.unit || '£';
    const money = v => (v < 0 ? '-' : '') + u + (Math.round(Math.abs(v) * 100) / 100).toLocaleString('en-GB', { maximumFractionDigits: 2 });
    const rnd = (a, b) => a + Math.random() * (b - a);
    let round = 0, total = 0, losses = 0;
    const play = () => {
      round++;
      let mine, rivals, truth = null;
      if (s.common) {
        truth = s.common.truth;
        const est = () => Math.round(truth * (1 + s.common.spread * (2 * Math.random() - 1)));
        mine = est();
        rivals = Array.from({ length: s.rivals }, () => {
          const e = est(), shade = s.mode === 'first' ? 0.06 : 0.02;
          return Math.round(buy ? e * (1 - shade) : e * (1 + shade));
        });
      } else {
        const [lo, hi] = s.range;
        mine = Math.round(rnd(lo, hi));
        rivals = Array.from({ length: s.rivals }, () => {
          const v = rnd(lo, hi);
          if (s.mode !== 'first') return Math.round(v);

        all.sort((a, b) => buy ? (b.b - a.b || a.r - b.r) : (a.b - b.b || a.r - b.r));

  // Sends the answers to the server, which marks them again and issues a certificate with a public verify page.
  async function saveCertificate(card, attempt = 1) {
    const say = (t, retry) => { const p = card.querySelector('#certStatus'); if (!p) return; p.innerHTML = t + (retry ? ' <button class="btn ghost small" id="certRetry" type="button">Try again</button>' : ''); const r = card.querySelector('#certRetry'); r && r.addEventListener('click', () => { say('Issuing your certificate…'); saveCertificate(card, attempt + 1); }); };

      if (r.passed && r.certificate) {
        Store.recordExam(course.id, r.score, r.total, true, r.certificate);
        say(`Certificate <b>${esc(r.certificate.id)}</b> is saved to your account. Anyone can check it at gambitschool.com/verify/${esc(r.certificate.id)}.`);
      } else say('The server marked this attempt below the pass mark, so no certificate was issued. Please retake the assessment.');
    } catch (err) {
      say(esc(err instanceof TypeError ? 'We couldn\'t reach Gambit to save your certificate.' : err.message), true);
    }
  }

  function finish() {
    [...segs.children].forEach(x => x.className = 'on');
    foot.hidden = true;
    const el = document.createElement('section'); el.className = 'step done-card';
    if (examMode) {
      const total = steps.length, passed = examScore >= course.exam.pass;
      const rec = Store.recordExam(course.id, examScore, total, passed);
      if (passed) saveCertificate(el);
      el.innerHTML = passed
        ? `<canvas class="piece-icon" data-piece="king" data-tone="accent" aria-hidden="true"></canvas>
           <span class="mono">Final assessment</span><h2>You <em>passed.</em></h2>
           <div class="tiles"><div class="tile"><span class="mono">Score</span><b class="num">${examScore} / ${total}</b></div><div class="tile"><span class="mono">Pass mark</span><b class="num">${course.exam.pass} / ${total}</b></div></div>
           <p class="prompt" id="certStatus">Issuing your certificate…</p>
           <div class="actions"><a class="btn accent" id="certBtn" href="certificate.html?c=${course.id}">Get your certificate</a><a class="btn ghost" href="app.html">Back to my learning</a></div>`
        : `<canvas class="piece-icon" data-piece="pawn" aria-hidden="true"></canvas>
           <span class="mono">Final assessment</span><h2>Not this time.</h2>
           <p class="prompt">You scored ${examScore} of ${total}. You need ${course.exam.pass} to pass. Every question comes with an explanation, so a second attempt usually goes better. ${rec.passed ? 'Your earlier pass still stands.' : ''}</p>
           <div class="actions"><a class="btn solid" href="lesson.html?c=${course.id}&exam=1">Try again</a><a class="btn ghost" href="course.html?c=${course.id}">Review lessons</a></div>`;
    } else {
      Store.complete(course.id, lesson.id);
      const ls = lessonsOf(course).filter(playable), idx = ls.indexOf(lesson), nxt = ls[idx + 1];
      const owns = Store.owns(course.id), allDone = ls.every(l => Store.isDone(course.id, l.id));
      let actions;
      if (anon) {
        const nx = lessonsOf(course).filter(playable)[lessonsOf(course).filter(playable).indexOf(lesson) + 1];
        const target = nx && (course.free || Store.owns(course.id)) ? `lesson.html?c=${course.id}&l=${nx.id}` : `course.html?c=${course.id}${course.free ? '' : '&buy=1'}`;
        el.innerHTML = `<canvas class="piece-icon" data-piece="${course.piece}" data-tone="accent" aria-hidden="true"></canvas>
          <span class="mono">${esc(course.title)}</span><h2>Lesson <em>complete.</em></h2>
          <p class="prompt">${course.free ? `Sign up free to save your progress and carry on with the other ${lessonsOf(course).length - 1} lessons, then earn your certificate.` : `The full course has ${lessonsOf(course).length} lessons, a final assessment and a certificate, for a one-off ${G.money(course.price)}. Signing up is free.`}</p>
          <div class="actions"><a class="btn solid" href="login.html?next=${encodeURIComponent(target)}">${course.free ? 'Sign up free and continue' : 'Sign up to unlock the course'}</a><a class="btn ghost" href="course.html?c=${course.id}">Course overview</a></div>`;
        stage.innerHTML = ''; stage.appendChild(el); G.paintIcons(el); return;
      }
      if (nxt && canOpen(course, nxt)) actions = `<a class="btn solid" href="lesson.html?c=${course.id}&l=${nxt.id}">Next: ${esc(nxt.title)}</a>`;
      else if (!owns && course.status === 'live') actions = `<button class="btn solid" id="unlock">Unlock the full course · ${G.money(course.price)}</button>`;
      else if (owns && allDone && course.exam) actions = `<a class="btn accent" href="lesson.html?c=${course.id}&exam=1">Take the final assessment</a>`;
      else actions = '';
      actions += `<a class="btn ghost" href="course.html?c=${course.id}">Course overview</a>`;
      el.innerHTML = `<canvas class="piece-icon" data-piece="${course.piece}" data-tone="accent" aria-hidden="true"></canvas>
        <span class="mono">${esc(course.title)}</span><h2>Lesson <em>complete.</em></h2>
        <div class="tiles">
          <div class="tile"><span class="mono">Lesson</span><b>${esc(lesson.title)}</b></div>
          <div class="tile"><span class="mono">Right first time</span><b class="num">${graded ? `${firstTry} / ${graded}` : 'n/a'}</b></div>
        </div>
        ${!owns && course.status === 'live' ? `<p class="prompt">That was the free lesson. The full course has ${lessonsOf(course).length} lessons, a final assessment and a certificate, for a one-off ${G.money(course.price)}.</p>` : ''}
        <div class="actions">${actions}</div>`;
    }
    stage.innerHTML = ''; stage.appendChild(el); G.paintIcons(el);
    const u = document.getElementById('unlock');
    u && u.addEventListener('click', () => G.checkout(course, () => { const ls = lessonsOf(course).filter(playable); const nx = ls.find(l => !Store.isDone(course.id, l.id)); location.href = nx ? `lesson.html?c=${course.id}&l=${nx.id}` : `course.html?c=${course.id}`; }));
  }
  show();
})();
</script>
</body>
</html>
